# Render Blueprint: the FastAPI backend plus its Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked sync: false are
# asked for once in the dashboard and never stored in git.
databases:
  - name: ai-trip-optimizer-db
    plan: free
    region: singapore
    databaseName: ai_trip_optimizer

services:
  - type: web
    name: ai-trip-optimizer-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-trip-optimizer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ai-trip-optimizer.vercel.app
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LITEAPI_API_KEY
        sync: false
